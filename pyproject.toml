[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["inventory", "config"]
omit = ["inventory/migrations/*", "inventory/tests/*", "config/wsgi.py"]
data_file = "data/quality/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["inventory/tests", "inventory/migrations"]
